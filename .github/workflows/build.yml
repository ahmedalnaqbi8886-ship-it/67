name: build-engine
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build EaxReverbEngine.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: EaxReverbEngine
          path: out/EaxReverbEngine.dll
